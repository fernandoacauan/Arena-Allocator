name: MSBuild C++

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]
        
jobs:
    build:
        runs-on: windows-latest
        
        steps:
        
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup NuGet
              uses: NuGet/setup-nuget@v4
              
            - name: Restore NuGet Packages
              run: nuget restore "Arena Allocator.sln"
  
            - name: Configure MSBuild
              uses: microsoft/setup-msbuild@v3
              
            - name: Compile project (Release & x64)
              run: msbuild "Arena Allocator.sln" /p:Configuration=Release /p:Platform=x64
            
            - name: Run Unit Tests
              run: .\x64\Release\ArenaTests.exe
            
            
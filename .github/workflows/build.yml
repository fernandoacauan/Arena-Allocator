name: MSBuild C++

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]
        
jobs:
    build:
        runs-on: windows-latest
        
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              
            - name: Configure MSBuild
              uses: microsoft/setup-msbuild@v3
              
            - name: Compile project (Release & x64)
              run: msbuild "Arena Allocator.sln" /p:Configuration=Release /p:Platform=x64
            
            